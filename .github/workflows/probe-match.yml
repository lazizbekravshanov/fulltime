# Temporary: inspects ESPN's match-level feeds (scorers, commentary) and the full
# leaders category list. This sandbox cannot reach ESPN, so the probe runs here.
name: Probe match feeds

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Probe
        run: |
          node - <<'JS'
          const get = async (url) => {
            const r = await fetch(url, { headers: { "user-agent": "league-tables-updater" } });
            if (!r.ok) throw new Error(r.status + " " + url);
            return r.json();
          };
          const show = (label, v) => console.log(label + ": " + JSON.stringify(v).slice(0, 700));

          // 1. every leaders category, so we can pick more than goals and assists
          for (const slug of ["eng.1", "esp.1", "uefa.champions"]) {
            try {
              const j = await get(`https://sports.core.api.espn.com/v2/sports/soccer/leagues/${slug}/seasons/2026/types/1/leaders`);
              console.log(`\n=== ${slug} categories`);
              for (const c of j.categories ?? [])
                console.log(`  ${c.name} | ${c.displayName} | ${c.abbreviation} | ${(c.leaders ?? []).length} entries`);
            } catch (e) { console.log("categories ERR " + e.message); }
          }

          // 2. does the scoreboard carry scoring detail for finished matches?
          let sampleEvent = null;
          for (const range of ["20260912", "20260815-20260831"]) {
            try {
              const j = await get(`https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates=${range}&limit=500`);
              const ev = (j.events ?? []).find(e => e.competitions?.[0]?.status?.type?.completed) ?? j.events?.[0];
              console.log(`\n=== scoreboard ${range}: ${(j.events ?? []).length} events`);
              if (!ev) continue;
              sampleEvent = sampleEvent ?? ev.id;
              const comp = ev.competitions[0];
              console.log("  event id: " + ev.id + "  name: " + (ev.name ?? ev.shortName));
              console.log("  competition keys: " + Object.keys(comp).join(", "));
              show("  details", (comp.details ?? []).slice(0, 3));
            } catch (e) { console.log("scoreboard ERR " + e.message); }
          }

          // 3. the match summary: scorers, key events, commentary
          if (sampleEvent) {
            for (const url of [
              `https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/summary?event=${sampleEvent}`,
              `https://site.web.api.espn.com/apis/site/v2/sports/soccer/eng.1/summary?event=${sampleEvent}`
            ]) {
              try {
                const j = await get(url);
                console.log(`\n=== summary ${url}`);
                console.log("  keys: " + Object.keys(j).join(", "));
                for (const k of ["keyEvents", "commentary", "scoringPlays", "plays"]) {
                  const v = j[k];
                  if (Array.isArray(v)) {
                    console.log(`  ${k}: ${v.length} entries`);
                    show("    first", v[0]);
                    show("    last", v[v.length - 1]);
                  }
                }
                if (j.boxscore) console.log("  boxscore keys: " + Object.keys(j.boxscore).join(", "));
                break;
              } catch (e) { console.log("summary ERR " + e.message); }
            }
          }
          JS
