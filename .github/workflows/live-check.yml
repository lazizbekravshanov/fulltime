name: Live check

# Loads the published site in a real browser, from a network that can reach both
# GitHub Pages and ESPN, and reports what it actually renders. Also refreshes the
# screenshots in docs/, which the README points at.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.49.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check the live site
        id: check
        run: node .github/scripts/live-check.mjs
        env:
          PW_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
      # A failed check is exactly when its report and its screenshots are worth
      # having, so commit them either way and let the step above decide the run.
      - name: Commit the screenshots and the report
        if: always()
        run: |
          .github/scripts/commit-and-push.sh \
            "docs: refresh live screenshots [skip ci]" \
            docs .github/probe/live-check.json
