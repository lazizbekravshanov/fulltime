name: Update standings

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/update-data.yml

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit tests
        run: |
          node scripts/scorers.test.cjs
          node scripts/guard.test.cjs
          node scripts/round.test.cjs
          node scripts/snapshot.test.cjs

      - name: Refresh standings and fixtures
        run: node scripts/update-standings.mjs

      - name: Commit if changed
        run: |
          .github/scripts/commit-and-push.sh \
            "chore: refresh standings and fixtures [skip ci]" \
            data.json athletes.json
