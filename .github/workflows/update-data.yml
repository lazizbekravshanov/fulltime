name: Update standings

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/update-data.yml

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit tests
        run: node scripts/scorers.test.cjs

      - name: Refresh standings and fixtures
        run: node scripts/update-standings.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json athletes.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: refresh standings and fixtures [skip ci]"
          # The live job commits to this same branch every few minutes, so a push
          # can lose a race it did nothing wrong in. Take what landed and retry
          # rather than failing a run whose data is perfectly good.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing onto what landed (attempt $i)"
            git pull --rebase --autostash -q origin main || exit 1
            sleep $((i * 4))
          done
          echo "could not push after 5 attempts"
          exit 1
